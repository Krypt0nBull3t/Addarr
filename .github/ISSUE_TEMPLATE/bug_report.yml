name: Bug report
description: Something in Addarr does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: bug
    attributes:
      label: Bug
      description: What goes wrong? Name the command or menu, and the service (Radarr, Sonarr, Lidarr, Transmission, SABnzbd, Bazarr) if one is involved.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a command such as /start or /movie.
      placeholder: |
        1. Send /movie
        2. Search for ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Fix
      description: Optional. Where the fix goes, if you know (file and line).
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Optional. How to check that the bug is gone, for example a test that fails before the fix and passes after it.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Addarr version, logs (remove API keys and tokens first), related issues.
