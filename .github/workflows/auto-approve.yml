# File: .github/workflows/auto-approve.yml
# Description: AI-powered PR review and auto-approve when CI passes

name: PR Review

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  checks: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    steps:
      - name: Get PR number and diff
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            // Find the PR for this branch
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`
            });
            if (pulls.data.length === 0) {
              core.setFailed('No open PR found for this branch');
              return;
            }
            const pr = pulls.data[0];
            const prNumber = pr.number;
            core.setOutput('number', prNumber);

            // Skip AI review for merge PRs (development → main)
            const isMergePR = pr.head.ref === 'development' && pr.base.ref === 'main';
            core.setOutput('skip_ai_review', isMergePR ? 'true' : 'false');
            if (isMergePR) {
              core.info('Merge PR detected (development → main) — skipping AI review');
            }

            // Get PR details
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || 'No description provided');

            // Skip fetching diff for merge PRs — no review needed
            if (isMergePR) return;

            // Get the diff
            const diff = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              mediaType: { format: 'diff' }
            });
            const fs = require('fs');
            // Truncate diff to ~50KB — filter step trims further to 20K with priority
            const diffText = diff.data.substring(0, 50000);
            fs.writeFileSync('pr_diff.txt', diffText);

      - name: Filter diff for code review
        if: steps.pr.outputs.number && steps.pr.outputs.skip_ai_review != 'true'
        run: |
          # Split diff into per-file sections, exclude non-code paths,
          # then prioritize and truncate at file boundaries to fit 20K char budget
          python3 << 'FILTER_EOF'
          import re

          CHAR_BUDGET = 20000

          with open('pr_diff.txt', 'r') as f:
              diff = f.read()

          # Paths to exclude entirely (not reviewable code)
          EXCLUDE_PATTERNS = [
              r'^\.claude/',
              r'^docs/',
              r'^translations/',
              r'^helm/',
              r'\.md$',
          ]

          # Priority tiers (lower = higher priority)
          def priority(path):
              if path.startswith('src/') and path.endswith('.py'):
                  return 0  # P0: source Python
              if path.endswith('.py') and '/' not in path:
                  return 1  # P1: root Python (run.py, setup.py)
              if path.startswith('tests/') and path.endswith('.py'):
                  return 2  # P2: test Python
              return 3      # P3: everything else

          # Split into per-file hunks
          file_diffs = re.split(r'(?=^diff --git )', diff, flags=re.MULTILINE)
          file_entries = []

          for section in file_diffs:
              if not section.strip():
                  continue
              match = re.search(r'\+\+\+ b/(.+)', section)
              if not match:
                  continue
              path = match.group(1).strip()
              if any(re.search(p, path) for p in EXCLUDE_PATTERNS):
                  continue
              file_entries.append((priority(path), path, section))

          # Sort by priority, then by path for stable ordering
          file_entries.sort(key=lambda e: (e[0], e[1]))

          # Accumulate files in priority order, never cut mid-file
          included = []
          dropped = []
          used = 0

          for pri, path, section in file_entries:
              size = len(section)
              if used + size <= CHAR_BUDGET:
                  included.append(section)
                  used += size
              else:
                  dropped.append(path)

          result = '\n'.join(included)

          if dropped:
              notice = (
                  "\n\n--- TRUNCATION NOTICE ---\n"
                  "The following files were omitted due to size budget:\n"
              )
              for p in dropped:
                  notice += f"  - {p}\n"
              notice += (
                  "Do NOT report issues about code in these files — "
                  "you cannot see their contents.\n"
              )
              result += notice

          with open('pr_diff_code.txt', 'w') as f:
              f.write(result)

          print(f"Included {len(included)} files ({used} chars), "
                f"dropped {len(dropped)} files")
          FILTER_EOF

      - name: Rule-based checks
        id: rules
        if: steps.pr.outputs.number && steps.pr.outputs.skip_ai_review != 'true'
        run: |
          WARNINGS=""

          # Use filtered diff (code only) for rule checks
          DIFF_FILE="pr_diff_code.txt"

          # Check for TODO/FIXME/HACK comments in added lines
          TODOS=$(grep "^+" "$DIFF_FILE" | grep -iE "(TODO|FIXME|HACK|XXX)" | head -10 || true)
          if [ -n "$TODOS" ]; then
            WARNINGS="${WARNINGS}\n**TODOs/FIXMEs found in new code:**\n\`\`\`\n${TODOS}\n\`\`\`\n"
          fi

          # Check for print statements in added Python lines
          PRINTS=$(grep "^+" "$DIFF_FILE" | grep -E "^\+.*\bprint\(" | grep -v "^+++" | grep -v "#" | head -10 || true)
          if [ -n "$PRINTS" ]; then
            WARNINGS="${WARNINGS}\n**Print statements found (use logger instead):**\n\`\`\`\n${PRINTS}\n\`\`\`\n"
          fi

          # Check for large files (>500 lines added) — count per file
          LARGE_FILES=$(awk '
            /^diff --git/ { if (fname && count > 500) print "- " fname " (" count " lines added)"; fname=""; count=0 }
            /^\+\+\+ b\// { fname=$0; sub(/^\+\+\+ b\//, "", fname) }
            /^\+[^+]/ { count++ }
            END { if (fname && count > 500) print "- " fname " (" count " lines added)" }
          ' pr_diff.txt || true)
          if [ -n "$LARGE_FILES" ]; then
            WARNINGS="${WARNINGS}\n**Large changes detected:**\n${LARGE_FILES}\n"
          fi

          # Check for hardcoded secrets patterns
          SECRETS=$(grep "^+" "$DIFF_FILE" | grep -iE "(api_key|apikey|secret|password|token)\s*=\s*['\"][^'\"]+['\"]" | grep -v "^+++" | head -5 || true)
          if [ -n "$SECRETS" ]; then
            WARNINGS="${WARNINGS}\n**⚠️ Possible hardcoded secrets found — please verify:**\n\`\`\`\n${SECRETS}\n\`\`\`\n"
          fi

          # Check for bare except clauses
          BARE_EXCEPT=$(grep "^+" "$DIFF_FILE" | grep -E "^\+\s*except\s*:" | grep -v "^+++" | head -5 || true)
          if [ -n "$BARE_EXCEPT" ]; then
            WARNINGS="${WARNINGS}\n**Bare except clauses found (use specific exceptions):**\n\`\`\`\n${BARE_EXCEPT}\n\`\`\`\n"
          fi

          if [ -n "$WARNINGS" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            # Write to file to preserve formatting
            printf "%b" "$WARNINGS" > rule_warnings.txt
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No issues found" > rule_warnings.txt
          fi

      - name: AI code review via Groq
        id: ai_review
        if: steps.pr.outputs.number && steps.pr.outputs.skip_ai_review != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: |
          # Build request with Python — use pre-filtered, budget-capped diff
          python3 << 'PYEOF'
          import json, os

          # Prefer filtered diff (code only, already truncated to budget)
          diff_file = 'pr_diff_code.txt' if os.path.exists('pr_diff_code.txt') else 'pr_diff.txt'
          with open(diff_file, 'r') as f:
              diff = f.read()

          title = os.environ.get('PR_TITLE', 'PR Review')
          pr_body = os.environ.get('PR_BODY', '').strip()
          description = f"\n\nPR Description:\n{pr_body}" if pr_body else ""

          request = {
              "model": "openai/gpt-oss-120b",
              "temperature": 0.3,
              "max_tokens": 2048,
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "You are a strict code reviewer for Addarr, a Python Telegram bot "
                          "using python-telegram-bot v20+, aiohttp, and a layered architecture "
                          "(handlers, services, API clients). All I/O is async.\n\n"
                          "CRITICAL CONSTRAINTS:\n"
                          "- The diff may be truncated. Files omitted due to size are listed "
                          "at the end.\n"
                          "- If you cannot see the complete implementation of a function, do "
                          "NOT assume it is incomplete or broken. Absence of code is not "
                          "evidence of a bug.\n"
                          "- For each issue, you MUST quote the exact line(s) from the diff "
                          "that demonstrate the problem. If you cannot quote real lines, do "
                          "not report the issue.\n\n"
                          "This project values minimal, focused changes. Most PRs are correct "
                          "and clean. A good review often has zero issues and zero suggestions. "
                          "Only report problems you are confident would cause a real failure.\n\n"
                          "QUALIFICATION PROCESS — for each potential issue, ask yourself:\n"
                          "1. Will this cause a runtime error, wrong result, or security hole? "
                          "If no, skip it.\n"
                          "2. Is this within the scope of what the PR actually changes? "
                          "If no, skip it.\n"
                          "3. Does this involve user input or an external API boundary? "
                          "Internal code paths that read bundled project files or call internal "
                          "functions are trusted and do not need extra error handling.\n"
                          "4. Am I suggesting a library replacement or architectural change? "
                          "Skip it — only the PR author decides those.\n\n"
                          "QUALIFIED issues are:\n"
                          "- Bugs that produce wrong results or crash at runtime\n"
                          "- Security vulnerabilities (injection, credential exposure)\n"
                          "- Breaking changes to existing behavior\n"
                          "- Resource leaks (unclosed sessions, missing await)\n"
                          "- Incorrect assumptions about external API response shapes\n"
                          "- Logic errors where the return value contradicts the function "
                          "name, docstring, or stated intent in the PR description\n\n"
                          "Format:\n"
                          "## Summary\nOne paragraph overview.\n\n"
                          "## Issues\nFor each issue:\n"
                          "1. **Description**: What is wrong\n"
                          "2. **Evidence**: Quote the exact diff line(s) showing the problem\n"
                          "3. **Impact**: What happens at runtime\n\n"
                          "Or 'No issues found.'\n\n"
                          "## Suggestions\nOnly if you identified a specific, actionable fix "
                          "for a qualified issue, or 'No suggestions.'\n\n"
                          "If the code is correct, respond with 'No issues found.' and "
                          "'No suggestions.' — this is the expected outcome for most PRs."
                      )
                  },
                  {
                      "role": "user",
                      "content": f"Review this PR.\n\nTitle: {title}{description}\n\nDiff:\n{diff}"
                  }
              ]
          }

          with open('request.json', 'w') as f:
              json.dump(request, f)

          print(f"Diff source: {diff_file} ({len(diff)} chars)")
          PYEOF

          # Call Groq API
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json)

          echo "Groq API HTTP status: ${HTTP_CODE}"

          # Extract the review text and strip any reasoning blocks
          python3 << 'PYEOF' > ai_review.txt
          import json, re, sys

          with open('response.json', 'r') as f:
              data = json.load(f)

          # Check for API error response
          if 'error' in data:
              err = data['error']
              msg = err.get('message', str(err))
              print(f"AI review unavailable (API error): {msg}", file=sys.stderr)
              print(f"AI review unavailable: {msg}")
              sys.exit(0)

          try:
              content = data['choices'][0]['message']['content']
              content = re.sub(r'<think>.*?</think>\s*', '', content, flags=re.DOTALL)
              print(content.strip())
          except (KeyError, IndexError) as e:
              print(f"Unexpected API response structure: {list(data.keys())}", file=sys.stderr)
              print(f"AI review unavailable: unexpected response format")
          PYEOF

      - name: Post review comment
        if: steps.pr.outputs.number
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.REVIEWER_BOT_TOKEN }}
          script: |
            const skipAiReview = '${{ steps.pr.outputs.skip_ai_review }}' === 'true';
            let body;

            if (skipAiReview) {
              body = `## 🤖 Automated PR Review\n\n`;
              body += `Merge PR (development → main) — AI review and rule checks skipped.\n`;
              body += `Individual PRs were already reviewed before merging into development.\n`;
            } else {
              const fs = require('fs');
              const aiReview = fs.readFileSync('ai_review.txt', 'utf8');
              const ruleWarnings = fs.readFileSync('rule_warnings.txt', 'utf8');
              const hasWarnings = '${{ steps.rules.outputs.found }}' === 'true';

              body = `## 🤖 Automated PR Review\n\n`;
              body += `### AI Review\n${aiReview}\n\n`;

              if (hasWarnings) {
                body += `### ⚠️ Rule-based Warnings\n${ruleWarnings}\n\n`;
              } else {
                body += `### ✅ Rule-based Checks\nNo issues found.\n\n`;
              }
            }

            // Post the review comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body: body
            });

      - name: Wait for all checks to complete
        id: all_checks
        if: >
          steps.pr.outputs.number &&
          github.event.workflow_run.conclusion == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;
            const selfName = 'PR Review';
            const maxAttempts = 30;
            const pollInterval = 10000; // 10 seconds

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: sha, per_page: 100
              });

              // Exclude our own workflow's runs to avoid waiting on ourselves
              const otherRuns = data.check_runs.filter(
                r => r.name !== selfName && r.name !== 'review'
              );

              const pending = otherRuns.filter(
                r => r.status !== 'completed'
              );
              const failed = otherRuns.filter(
                r => r.status === 'completed' &&
                     r.conclusion !== 'success' &&
                     r.conclusion !== 'skipped' &&
                     r.conclusion !== 'neutral'
              );

              if (pending.length === 0 && failed.length === 0) {
                core.info(`All ${otherRuns.length} checks passed.`);
                core.setOutput('ready', 'true');
                return;
              }

              if (pending.length === 0 && failed.length > 0) {
                const names = failed.map(r => `${r.name} (${r.conclusion})`).join(', ');
                core.warning(`Checks failed: ${names}`);
                core.setOutput('ready', 'false');
                return;
              }

              const names = pending.map(r => r.name).join(', ');
              core.info(`Attempt ${attempt}/${maxAttempts}: waiting on ${pending.length} check(s): ${names}`);
              await new Promise(r => setTimeout(r, pollInterval));
            }

            core.warning('Timed out waiting for all checks to complete.');
            core.setOutput('ready', 'false');

      - name: Approve PR
        if: >
          steps.all_checks.outputs.ready == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.REVIEWER_BOT_TOKEN }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr.outputs.number }},
              event: 'APPROVE',
              body: 'All CI checks passed. Review complete — auto-approved.'
            });
