# filename: docker-compose.yml
# author: Christian Blank (https://github.com/Cyneric)
# created date: 2024-11-08
# description: Docker compose file for Addarr Refresh Telegram Bot.

version: '3'
services:
  addarr:
    container_name: addarr-refresh
    build: .
    restart: unless-stopped
    # Rotate the console log (docker logs) so it cannot fill the disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Host networking: Addarr reaches the *arr apps and download clients on the host.
    # Its one listening port is the webhook receiver, webhooks.host:webhooks.port
    # (default 127.0.0.1:8080). *arr apps on another host need host: 0.0.0.0.
    #
    # To use bridge networking instead (e.g. for Docker Swarm or stricter
    # network isolation), remove this line and ensure Addarr can reach
    # your media services via their container names or host.docker.internal.
    network_mode: host
    volumes:
      # Writable: /auth and settings changes save config.yaml
      - ./config.yaml:/app/config.yaml:rw
      - ./logs:/app/logs:rw
      - ./backup:/app/backup:rw
      # Named volume for user_preferences.json. A new named volume gets the
      # image's ownership, so the non-root user can write it on a fresh install
      - addarr-data:/app/data
    environment:
      - PYTHONPATH=/app
    healthcheck:
      # The bot touches its heartbeat file while its loop runs. Unhealthy when the
      # file is missing or older than 60 s. Compose reads $$ as a literal $.
      test: ["CMD-SHELL", "F=\"$${ADDARR_HEARTBEAT_FILE:-/tmp/addarr-heartbeat}\"; [ -f \"$$F\" ] && [ $$(( $$(date +%s) - $$(stat -c %Y \"$$F\") )) -lt 60 ] || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  addarr-data:
